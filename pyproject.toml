[project]
name = "rfc8-examples"
version = "0.0.1"
description = "Examples for NGFF RFC-8 collections."
readme = "README.md"
authors = [
    { name = "Tommaso Comparin", email = "tommaso.comparin@exact-lab.it" }
]
requires-python = ">=3.12"
dependencies = [
    "ngio-collections",
    "numpy>=2.5.4",
    "requests>=2.34.2,<2.35.0",
    "zarr >= 3.4.0, < 3.5.0",
]

[project.scripts]
all = "rfc8_examples.all:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
ngio-collections = { git = "https://github.com/BioVisionCenter/ngio-collections", rev = "v0.0.1" }
